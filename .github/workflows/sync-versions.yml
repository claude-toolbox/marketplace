name: Sync Plugin Versions

on:
  schedule:
    - cron: '17 */6 * * *'  # Every 6 hours, offset minute
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and update plugin versions
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE=".claude-plugin/marketplace.json"
          UPDATED=false

          PLUGINS=$(jq -c '.plugins[]' "$FILE")

          for plugin in $PLUGINS; do
            NAME=$(echo "$plugin" | jq -r '.name')
            REPO=$(echo "$plugin" | jq -r '.source.repo')
            CURRENT=$(echo "$plugin" | jq -r '.version')

            TAG=$(gh api "repos/$REPO/tags?per_page=100" --jq '
              [.[] | select(.name | startswith("v"))] | sort_by(.name) | reverse | .[0].name // empty
            ' 2>/dev/null || echo "")

            if [ -z "$TAG" ]; then
              echo "WARN: $NAME — no v* tags found, skipping"
              continue
            fi

            LATEST="${TAG#v}"

            if [ "$CURRENT" = "$LATEST" ]; then
              echo "OK: $NAME@$CURRENT"
            else
              echo "UPDATE: $NAME $CURRENT → $LATEST"
              jq --arg name "$NAME" --arg version "$LATEST" \
                '(.plugins[] | select(.name == $name)) |= (.version = $version)' \
                "$FILE" > tmp.json && mv tmp.json "$FILE"
              UPDATED=true
            fi
          done

          if [ "$UPDATED" = "true" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "All plugins up to date."
          fi

      - name: Commit and push
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "chore: sync plugin versions"
          git push
